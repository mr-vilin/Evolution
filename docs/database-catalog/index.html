<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>数据库文档</title>
<link id="catalog-icon" rel="icon" type="image/svg+xml" sizes="any" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2232%22%20height%3D%2232%22%20viewBox%3D%220%200%2032%2032%22%3E%20%3Cpath%20fill%3D%22%232c1810%22%20d%3D%22M0%200h32v32H0z%22%2F%3E%20%3Cpath%20fill%3D%22%23ff6b35%22%20d%3D%22M2%202h28v28H2z%22%2F%3E%20%3Cpath%20fill%3D%22%232c1810%22%20fill-rule%3D%22evenodd%22%20d%3D%22M6.8%2010.5h3.7c3.5%200%205.6%202%205.6%205.5s-2.1%205.5-5.6%205.5H6.8zm2.3%202v7h1.25c2.16%200%203.38-1.19%203.38-3.5s-1.22-3.5-3.38-3.5z%20M17.8%2010.5h4.2c2.45%200%203.78%201.08%203.78%202.83%200%201.07-.56%201.95-1.47%202.36%201.3.4%201.98%201.32%201.98%202.59%200%202.05-1.57%203.22-4.05%203.22H17.8zm2.27%201.9v2.49h1.77c1.03%200%201.66-.44%201.66-1.24%200-.84-.61-1.25-1.68-1.25zm0%204.23v2.96h2.01c1.19%200%201.88-.49%201.88-1.46%200-.98-.69-1.5-1.88-1.5z%22%2F%3E%20%3C%2Fsvg%3E">
<style>
:root {
  color-scheme: light;
  --paper: #fffaf0;
  --screen-motion: 440ms cubic-bezier(.22, .72, .2, 1);
  --page-max-width: 1480px;
  --page-gutter: 24px;
  --page-width: min(var(--page-max-width), calc(100% - 2 * var(--page-gutter)));
  --warm: #fff5e6;
  --card: #fff;
  --ink: #2c1810;
  --muted: #6b5344;
  --line: #e8ddd4;
  --accent: #ff6b35;
  --accent-dark: #e55a2b;
  --accent-text: #9b3b1a;
  --brown: #8b4513;
  --green: #4a7c59;
  --heading: "Playfair Display SC", Georgia, "Songti SC", SimSun, serif;
  --body: Karla, "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  font-family: var(--body);
}
* { box-sizing: border-box }
body {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  margin: 0;
  color: var(--ink);
  background: var(--paper);
}
body[data-screen="catalog"] { background-color: var(--ink) }
button, input, select { color: inherit; font: inherit }
button { cursor: pointer }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid var(--accent-dark);
  outline-offset: 3px;
}
[hidden] { display: none !important }
h1, h2, h3, p { margin: 0 }
code, pre { font-family: "IBM Plex Mono", Consolas, monospace }
.screen-viewport {
  flex: 1;
  min-height: 0;
  overflow: clip;
}
.screen-track {
  display: flex;
  width: 100%;
  height: 100%;
  transform: translateX(0);
}
body[data-screen="catalog"] .screen-track { transform: translateX(-100%) }
.screen {
  flex: 0 0 100%;
  min-height: 0;
  background: var(--paper);
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.bar {
  flex: 0 0 auto;
  position: relative;
  z-index: 1;
  width: var(--page-width);
  min-height: 68px;
  margin: 16px auto 0;
  padding: 10px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  background: var(--paper);
  border: 2px solid var(--ink);
  box-shadow: 4px 4px var(--ink);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  font: 700 1.28rem/1.2 var(--heading);
  color: var(--ink);
  text-decoration: none;
  overflow-wrap: anywhere;
}
.mark {
  display: block;
  width: 32px;
  height: 32px;
  flex: 0 0 32px;
}
.cover-main {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  width: var(--page-width);
  margin-inline: auto;
  padding-block: 20px;
  overflow: auto;
}
.hero {
  flex: 0 0 auto;
  width: 100%;
  margin-block: auto;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  align-items: center;
  gap: 48px;
}
.database-label {
  min-width: 0;
  max-width: 64%;
  color: var(--muted);
  font-size: .75rem;
  font-weight: 400;
  line-height: 1.4;
  text-align: right;
  overflow-wrap: anywhere;
}
.hero h1 {
  margin: 0 0 21px;
  font: 700 clamp(2.8rem, 4.7vw, 4.15rem)/1.06 var(--heading);
  letter-spacing: .015em;
  overflow-wrap: anywhere;
}
.hero-name, .hero-title { display: block }
.hero-title {
  color: var(--accent-dark);
  font-family: system-ui, sans-serif;
  font-size: clamp(2.55rem, calc(4.7vw + .625rem), 5rem);
  line-height: 1.08;
  letter-spacing: -.05em;
}
.hero p {
  max-width: 448px;
  color: var(--muted);
  font-size: 1.08rem;
  line-height: 1.7;
}
.hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 27px }
.branch-label {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: .25rem .55rem;
  max-width: 100%;
  margin-bottom: 17px;
  padding: .45rem .8rem;
  border: 2px solid var(--ink);
  background: var(--warm);
  color: var(--ink);
  font-size: .83rem;
}
.branch-label code { min-width: 0; color: var(--ink); overflow-wrap: anywhere }
.primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .8em;
  min-height: 54px;
  padding: 12px 23px;
  border: 2px solid var(--ink);
  border-radius: 12px;
  box-shadow: 4px 4px var(--ink);
  color: var(--ink);
  font-weight: 700;
  line-height: 1.2;
}
.primary { background: var(--accent); color: #fff }
.primary:hover { transform: translate(2px, 2px); box-shadow: 2px 2px var(--ink) }
.summary {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  align-items: start;
  gap: 14px;
  padding: 0 4px 4px 0;
}
.summary-column { display: grid; gap: 14px }
.summary-column:last-child { padding-top: 25px }
.metric, .shortcut-panel {
  position: relative;
  min-width: 0;
  overflow: hidden;
  padding: clamp(14px, 2vw, 25px);
  border: 2px solid var(--ink);
  box-shadow: 4px 4px var(--ink);
}
.metric {
  min-height: clamp(145px, 13vw, 190px);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: flex-start;
  gap: .2rem;
  isolation: isolate;
}
.metric::after {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 12px 16px auto auto;
  width: 43%;
  height: 67%;
  opacity: .18;
}
.metric--tables { background: var(--accent); color: #fff }
.metric--tables::after {
  color: #fff;
  border: 1px solid currentColor;
  background:
    linear-gradient(currentColor, currentColor) 23% 0 / 1px 100% no-repeat,
    linear-gradient(to bottom, transparent calc(100% - 1px), currentColor 0) 0 0 / 100% calc(100% / 7) repeat-y;
  opacity: .36;
}
.metric--fields { min-height: clamp(155px, 17.4vw, 250px); background: var(--ink); color: var(--paper) }
.metric--fields::after {
  background: radial-gradient(circle, var(--accent) 1.2px, transparent 1.6px) 0 0 / 13px 13px;
  opacity: .55;
}
.metric--modules { min-height: clamp(140px, 14vw, 200px); background: var(--warm) }
.metric--modules::after { content: none }
.module-diagram {
  position: absolute;
  z-index: -1;
  top: 17%;
  right: 8%;
  width: 45%;
  height: 58%;
  display: grid;
  grid-template: repeat(2, minmax(0, 1fr)) / repeat(3, minmax(0, 1fr));
  gap: 36% 9%;
  background:
    linear-gradient(var(--brown), var(--brown)) center 50% / 74% 1px no-repeat,
    linear-gradient(var(--brown), var(--brown)) center / 1px 38% no-repeat,
    linear-gradient(var(--brown), var(--brown)) 13% 60% / 1px 24% no-repeat,
    linear-gradient(var(--brown), var(--brown)) 87% 60% / 1px 24% no-repeat;
  opacity: .38;
}
.module-diagram i { grid-row: 2; background: var(--warm); border: 1px solid var(--brown) }
.module-diagram i:first-child { grid-area: 1 / 2; background: #f9dfbc }
.metric strong {
  font: 700 clamp(2.6rem, 5.5vw, 4.7rem)/.95 var(--heading);
  letter-spacing: -.03em;
  font-variant-numeric: lining-nums;
}
.metric span { font-size: .95rem; font-weight: 700 }
.shortcut-panel { background: var(--card); padding-block: 15px }
.shortcut-panel h2 { margin-bottom: .5rem; font: 700 1rem/1.35 var(--body) }
.shortcuts {
  display: grid;
  gap: 2px;
  padding: 2px;
}
.shortcut {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 6px;
  width: 100%;
  padding: 3px 6px;
  text-align: left;
  background: var(--card);
  border: 0;
  border-radius: 4px;
  color: var(--muted);
  font-size: .8rem;
  overflow-wrap: anywhere;
}
.shortcut:hover { background: var(--warm); color: var(--accent-text) }
.shortcut:focus-visible { outline-offset: -1px }
.shortcut-more { font-weight: 700; letter-spacing: .08em }
.shortcut span { color: var(--accent-text); flex: 0 0 auto }
.footer {
  width: 100%;
  padding: 12px max(var(--page-gutter), calc((100% - var(--page-max-width)) / 2)) 16px;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 4px 16px;
  background: var(--ink);
  color: var(--paper);
  font-size: .8rem;
  overflow-wrap: anywhere;
}
.footer span:last-child { margin-inline-start: auto; text-align: right }
#catalog {
  --muted: #d4c1b5;
  --line: rgb(255 250 240 / .25);
  --surface-hover: rgb(255 250 240 / .07);
  --surface-selected: rgb(255 107 53 / .13);
  --accent-text: #ffa47e;
  --green: #b0dcb5;
  color: var(--paper);
  background: var(--ink);
  color-scheme: dark;
}
.workspace {
  flex: 1;
  min-height: 0;
  width: var(--page-width);
  margin: 20px auto;
  display: grid;
  grid-template-columns: minmax(148px, 15%) minmax(224px, 23%) minmax(0, 1fr);
  gap: 13px;
}
.pane {
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--line);
}
.pane-title {
  display: flex;
  gap: .6rem;
  align-items: baseline;
  justify-content: space-between;
  padding: .95rem 1rem;
  border-bottom: 1px solid var(--line);
}
.pane-title h2 { font: 700 1rem/1.35 var(--heading); letter-spacing: .02em }
.pane-title span, .hint { font-size: .82rem; color: var(--muted) }
.scroll { overflow: auto; min-height: 0; flex: 1 }
#catalog ::-webkit-scrollbar { width: 2px; height: 2px }
#catalog ::-webkit-scrollbar-track,
#catalog ::-webkit-scrollbar-corner { background: transparent }
#catalog ::-webkit-scrollbar-button { display: none }
#catalog ::-webkit-scrollbar-thumb {
  background: rgb(255 250 240 / .48);
  border-radius: 999px;
}
@supports not selector(::-webkit-scrollbar) {
  #catalog .scroll, #catalog .table-wrap {
    scrollbar-width: thin;
    scrollbar-color: rgb(255 250 240 / .48) transparent;
  }
}
.modules, .table-list { padding: .4rem .65rem }
.module, .table-choice {
  display: block;
  width: 100%;
  padding: .64rem .68rem;
  border: 1px solid transparent;
  border-bottom-color: var(--line);
  background: transparent;
  text-align: left;
  overflow-wrap: anywhere;
}
.module { display: flex; justify-content: space-between; align-items: center; gap: .5rem; font-size: .87rem }
.module small, .table-choice small { color: var(--muted) }
.module:last-child, .table-choice:last-child { border-bottom-color: transparent }
.module:hover, .table-choice:hover { background: var(--surface-hover) }
.module[aria-pressed=true], .table-choice[aria-pressed=true] {
  background: var(--surface-selected);
  border-bottom-color: var(--line);
  box-shadow: inset 2px 0 var(--accent);
}
.table-choice code { display: block; margin-bottom: .23rem; font-size: .88rem; font-weight: 700 }
.table-choice small { display: block; line-height: 1.45 }
.filters { display: grid; gap: .55rem; padding: .7rem .8rem; border-bottom: 1px solid var(--line) }
.filters label { display: grid; gap: .24rem; font-size: .76rem; font-weight: 700 }
.filters input, .filters select {
  width: 100%;
  min-height: 2.25rem;
  padding: .4rem .52rem;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 0;
  font-size: .83rem;
}
.filters input::placeholder { color: var(--muted) }
.filters option { background: var(--ink); color: var(--paper) }
.badge {
  display: inline-block;
  vertical-align: baseline;
  margin-top: .36rem;
  padding: .12rem .44rem;
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: .74rem;
  font-weight: 600;
}
.badge[data-status="启用中"] { color: var(--green) }
.badge[data-status="未启用"] { color: #f4cf91 }
.badge[data-status="已废弃"] { color: #ffb3a2 }
.detail { padding: 1.15rem clamp(.9rem, 2.3vw, 2rem) 2rem }
.detail h2 { font-size: clamp(1.16rem, 2.35vw, 1.95rem); overflow-wrap: anywhere }
.detail h3 { margin: 1.25rem 0 .48rem; font: 700 1rem/1.4 var(--heading) }
.detail-panel { margin-top: .95rem }
.detail-panel > h3:first-child { margin-top: 0 }
.detail p { margin: .5rem 0; line-height: 1.6; overflow-wrap: anywhere }
.detail-meta {
  padding: .64rem .76rem;
  border: 1px solid var(--line);
  border-left: 2px solid var(--accent);
  color: var(--muted);
  font-size: .8rem;
  overflow-wrap: anywhere;
}
.tabbar { display: flex; flex-wrap: wrap; gap: .36rem; margin-top: 1.05rem; border-bottom: 1px solid var(--line) }
.tabbar button {
  padding: .58rem .57rem;
  border: 0;
  border-bottom: 3px solid transparent;
  background: transparent;
  font-size: .85rem;
}
.tabbar button:hover { background: var(--surface-hover) }
.tabbar button[aria-pressed=true] { background: var(--surface-selected); color: var(--accent-text); border-color: var(--accent); font-weight: 700 }
.table-wrap { width: 100%; overflow: auto; border: 1px solid var(--line) }
table { width: 100%; border-collapse: collapse; font-size: .83rem }
th, td { padding: .54rem .62rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top }
th { white-space: nowrap }
th:not(:last-child), td:not(:last-child) { border-right: 1px solid var(--line) }
td { line-height: 1.5 }
td code { overflow-wrap: anywhere }
tr:last-child td { border-bottom: 0 }
.field-name { display: inline-flex; align-items: center; gap: .45rem }
.pk-tab {
  padding: .05rem .224rem;
  border: 1px solid var(--accent-text);
  background: var(--surface-selected);
  color: var(--accent-text);
  font-size: .52rem;
  font-weight: 700;
  line-height: 1.2;
}
.fields td:nth-child(-n+2) code { white-space: nowrap }
.fields td:last-child { min-width: 12ch }
.example td { min-width: 7ch; max-width: 20ch }
.empty { padding: 1.05rem; color: var(--muted) }
.warning { color: var(--accent-text); font-size: .875rem }
.warning summary { cursor: pointer }
.warning ul { padding-left: 1.4rem; line-height: 1.65 }
.rel-link { padding: 0; border: 0; background: transparent; color: var(--accent-text); text-decoration: underline; overflow-wrap: anywhere }
.mobile-nav { display: none }
@media (max-width: 850px) {
  :root { --page-gutter: 14px }
  .bar { min-height: 54px; padding: 7px 11px; margin-top: 9px }
  .brand { font-size: 1.1rem }
  .mark { width: 27px; height: 27px; flex-basis: 27px }
  .database-label { font-size: .69rem }
  .cover-main { padding-block: 23px }
  .hero { grid-template-columns: minmax(0, 1fr); gap: 25px }
  .hero h1 { margin-bottom: 15px; font-size: clamp(2.55rem, 8.5vw, 3.7rem) }
  .hero-title { font-size: clamp(2.2rem, calc(8.5vw + .6rem), 4.65rem) }
  .hero p { font-size: 1rem }
  .hero-actions { margin-top: 19px }
  .hero-actions button { min-height: 45px; padding: 9px 14px; font-size: .89rem }
  .summary { gap: 10px }
  .summary-column { gap: 10px }
  .summary-column:last-child { padding-top: 16px }
  .shortcut-panel { padding-inline: 10px }
  .workspace { display: flex; margin: 10px auto }
  .pane { width: 100% }
  .pane:not([data-visible]) { display: none }
  .mobile-nav { display: flex; gap: .4rem; width: var(--page-width); margin: .66rem auto 0 }
  .mobile-nav button {
    flex: 1;
    min-height: 2.2rem;
    border: 1px solid var(--line);
    background: transparent;
    font-size: .83rem;
  }
  .mobile-nav button[aria-pressed=true] { background: var(--surface-selected); border-color: var(--accent); font-weight: 700 }
}
@media (prefers-reduced-motion: no-preference) {
  body[data-ready] { transition: background-color var(--screen-motion) }
  body[data-ready] .screen-track { transition: transform var(--screen-motion) }
  .primary { transition: transform .15s, box-shadow .15s, background .15s }
}
</style>
</head>
<body data-screen="home">
<header class="bar">
  <a class="brand" id="back" href="#" aria-label="返回首页"><img class="mark" id="brand-mark" alt=""><span data-project></span></a>
  <span class="database-label" data-database></span>
</header>
<div class="screen-viewport">
<div class="screen-track" id="screen-track">
<section class="screen" id="home" aria-labelledby="home-title" tabindex="-1">
  <main class="cover-main">
    <div class="hero">
      <div class="hero-intro">
        <span class="branch-label">整理分支 <code id="snapshot-branch"></code></span>
        <h1 id="home-title"><span class="hero-name" data-project></span><span class="hero-title">数据库文档</span></h1>
        <p>按业务模块查阅当前代码定义的表结构、字段备注与示例数据。</p>
        <div class="hero-actions">
          <button type="button" class="primary" id="browse">浏览数据表 <span aria-hidden="true">→</span></button>
        </div>
      </div>
      <section class="summary" aria-label="数据库概况">
        <div class="summary-column">
          <div class="metric metric--tables"><strong data-count="tables"></strong><span>数据表</span></div>
          <div class="shortcut-panel">
            <h2 id="module-overview">主要业务模块</h2>
            <nav id="module-shortcuts" aria-labelledby="module-overview">
              <div class="shortcuts" id="shortcuts"></div>
            </nav>
          </div>
        </div>
        <div class="summary-column">
          <div class="metric metric--fields"><strong data-count="fields"></strong><span>字段</span></div>
          <div class="metric metric--modules">
            <strong data-count="modules"></strong><span>业务模块</span>
            <div class="module-diagram" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          </div>
        </div>
      </section>
    </div>
  </main>
  <footer class="footer"><span>Design By Vilin</span><span id="snapshot-time"></span></footer>
</section>
<section class="screen" id="catalog" aria-label="数据库目录" tabindex="-1" inert>
  <nav class="mobile-nav" aria-label="目录栏目"></nav>
  <div class="workspace">
    <section class="pane" id="module-pane">
      <div class="pane-title"><h2>业务模块</h2></div>
      <nav class="scroll modules" id="modules" aria-label="业务模块"></nav>
    </section>
    <section class="pane" id="list-pane" data-visible>
      <div class="pane-title"><h2>数据表</h2><span id="result-count" aria-live="polite"></span></div>
      <div class="filters">
        <label>搜索<input id="search" type="search" placeholder="表名、字段或备注"></label>
        <label>表状态<select id="status"><option value="">全部状态</option><option>启用中</option><option>未启用</option><option>已废弃</option><option>待确认</option></select></label>
      </div>
      <div class="scroll table-list" id="table-list"></div>
    </section>
    <article class="pane" id="detail-pane" aria-label="表详情">
      <div class="scroll detail" id="detail"></div>
    </article>
  </div>
</section>

<script>
"use strict";
const doc = JSON.parse(document.getElementById("catalog-data").textContent);
const get = id => document.getElementById(id);
const states = { module: "", table: "", tab: "字段", mobile: "list" };
const modules = new Map();
const tables = new Map(doc.tables.map(table => [table.name, table]));
const labels = { Index: "索引", UniqueConstraint: "唯一约束", ForeignKeyConstraint: "外键",
                 PrimaryKeyConstraint: "主键", CheckConstraint: "校验约束" };
for (const table of doc.tables) {
  modules.set(table.module, (modules.get(table.module) || 0) + 1);
  table.search = [table.name, table.comment, table.module, table.business, ...table.columns.map(column =>
    [column.name, column.comment, column.type].join(" "))].join(" ").toLowerCase();
}
function element(tag, text = "", cls = "") {
  const node = document.createElement(tag);
  node.textContent = text;
  if (cls) node.className = cls;
  return node;
}
function button(text, cls, action, pressed) {
  const node = element("button", text, cls);
  node.type = "button";
  if (pressed !== undefined) node.setAttribute("aria-pressed", String(pressed));
  node.addEventListener("click", action);
  return node;
}
function badge(status) {
  const node = element("span", status, "badge");
  node.dataset.status = status;
  return node;
}
function source(ref) { return ref.file + ":" + ref.line; }
function setMobile(target) {
  states.mobile = target;
  for (const key of ["module","list","detail"]) {
    get(key + "-pane").toggleAttribute("data-visible", key === target);
    get("nav-" + key).setAttribute("aria-pressed", String(key === target));
  }
}
function show(screen) {
  const previous = document.body.dataset.screen;
  if (screen === previous) return;
  const outgoing = get(previous);
  const incoming = get(screen);
  const moveFocus = outgoing.contains(document.activeElement);
  incoming.inert = false;
  outgoing.inert = true;
  document.body.dataset.screen = screen;
  if (moveFocus) incoming.focus({ preventScroll: true });
}
function tableLink(name) {
  return "#table=" + encodeURIComponent(name);
}
function setTable(name, userAction = false) {
  states.table = name;
  states.tab = "字段";
  history.replaceState(null, "", name ? tableLink(name) : "#catalog");
  if (userAction) setMobile("detail");
  renderList(matching());
  renderDetails();
}
function selectModule(module) {
  states.module = module;
  get("search").value = "";
  get("status").value = "";
  show("catalog");
  setMobile("list");
  render();
}
function matching() {
  const query = get("search").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const status = get("status").value;
  return doc.tables.filter(row => (!states.module || row.module === states.module) &&
                                  (!status || row.status === status) && query.every(word => row.search.includes(word)));
}
function renderModules() {
  const entries = [["",doc.tables.length], ...modules];
  get("modules").replaceChildren(...entries.map(([key,count]) => {
    const node = button(key || "全部模块", "module", () => selectModule(key), key === states.module);
    node.append(element("small", String(count)));
    return node;
  }));
}
function renderList(rows) {
  get("result-count").textContent = rows.length + " 张";
  const items = rows.map(row => {
    const node = button("", "table-choice", () => setTable(row.name, true), row.name === states.table);
    node.append(element("code", row.name), element("small", row.comment || "备注未填写"), badge(row.status));
    return node;
  });
  get("table-list").replaceChildren(...(items.length ? items : [element("p","没有匹配的数据表","empty")]));
}
function grid(headers, rows, cls = "") {
  const table = element("table", "", cls);
  const head = table.createTHead().insertRow();
  for (const header of headers) {
    const cell = element("th", header);
    cell.scope = "col";
    head.append(cell);
  }
  const body = table.createTBody();
  for (const row of rows) {
    const target = body.insertRow();
    for (const value of row) {
      const cell = target.insertCell();
      if (value instanceof Node) cell.append(value);
      else cell.textContent = value ?? "NULL";
    }
  }
  const wrap = element("div", "", "table-wrap");
  wrap.append(table);
  return wrap;
}
function fieldInfo(column) {
  const parts = [column.comment || "未填写"];
  if (column.enum.length) parts.push("取值 " + column.enum.join("、"));
  if (column.collation) parts.push("排序规则 " + column.collation);
  return parts.join(" · ");
}
function renderFields(row) {
  const rows = row.columns.map(column => {
    const name = element("span", "", "field-name");
    name.append(element("code", column.name));
    if (column.pk) {
      const primaryKey = element("span", "PK", "pk-tab");
      primaryKey.title = "主键";
      name.append(primaryKey);
    }
    let defaultValue = column.db_default ?? "";
    if (defaultValue === "") {
      const applicationDefault = column.app_default ?? "";
      defaultValue = applicationDefault === "" ? "-" : "- / " + applicationDefault + "（应用默认" + applicationDefault + "）";
    }
    return [name, element("code", column.type), column.nullable ? "是" : "否", defaultValue, fieldInfo(column)];
  });
  return grid(["字段", "类型", "可空", "数据库默认值", "备注"], rows, "fields");
}
function relationTarget(target) {
  const tableName = target.slice(0,target.lastIndexOf("."));
  if (!tables.has(tableName)) return element("code", target);
  return button(target, "rel-link", () => {
    states.module = "";
    get("search").value = "";
    get("status").value = "";
    setTable(tableName, true);
    renderModules();
  });
}
function renderRelationships(row) {
  const fragment = document.createDocumentFragment();
  const indexes = row.constraints.map(item => [
    labels[item.kind] || item.kind,
    item.kind === "PrimaryKeyConstraint" ? "PRIMARY" : (item.name || "-"),
    item.columns.join("、") || "-",
  ]);
  const primary = row.columns.filter(col => col.pk).map(col => col.name);
  if (primary.length && !row.constraints.some(item => item.kind === "PrimaryKeyConstraint")) indexes.unshift(["主键","PRIMARY",primary.join("、")]);
  for (const col of row.columns) {
    if (col.unique) indexes.push(["唯一约束","-",col.name]);
    if (col.index) indexes.push(["索引","-",col.name]);
  }
  fragment.append(element("h3","约束与索引"), indexes.length ? grid(["类型","名称","字段"],indexes) :
    element("p","源码中未定位到约束或索引","hint"), element("h3","表关系"));
  fragment.append(row.relations.length ? grid(["字段","类型","目标"], row.relations.map(item =>
    [element("code", item.column), item.kind, relationTarget(item.target)])) : element("p","源码中未定位到关联","hint"));
  return fragment;
}
function renderExamples(row) {
  const fragment = document.createDocumentFragment();
  fragment.append(element("p","以下为本地合成示例。敏感字段以占位符显示。","hint"));
  const rows = row.examples.map(record => row.example_columns.map(name => {
    const value = record[name];
    if (value === undefined) return element("code", "-");
    const formatted = value !== null && typeof value === "object" ? JSON.stringify(value) : String(value);
    return element("code", formatted);
  }));
  fragment.append(grid(row.example_columns, rows, "example"));
  return fragment;
}
function renderSources(row) {
  const fragment = document.createDocumentFragment();
  fragment.append(element("p", "当前定义 " + source(row.source)));
  if (row.ddl_source) fragment.append(element("p", "建表来源 " + source(row.ddl_source)));
  const optionDescriptions = new Map([
    ["mysql_engine", "存储引擎，决定表如何存储数据以及支持哪些事务和锁机制。"],
    ["mysql_charset", "默认字符集，决定文本字段可存储哪些字符。"],
    ["mysql_collate", "默认排序规则，决定文本如何比较和排序。"],
  ]);
  const options = Object.entries(row.options).map(([name, value]) =>
    [name, value, optionDescriptions.get(name) || "-"]);
  if (options.length) fragment.append(grid(["表选项","值","中文说明"],options));
  if (row.status_source) fragment.append(element("p", "状态依据 " + row.status_source, "hint"));
  if (row.differences.length) {
    const list = element("ul");
    list.append(...row.differences.map(text => element("li",text)));
    fragment.append(element("h3","结构待核对"), list);
  }
  if (doc.warnings.length) {
    const details = element("details", "", "warning");
    const list = element("ul");
    list.append(...doc.warnings.map(item => element("li",item.message + " · " + source(item.source))));
    details.append(
      element("summary", "需查看实际数据库确认的迁移（" + doc.warnings.length + " 项）"),
      element("p", "生成目录时只读取项目文件。以下提示适用于整个项目。涉及运行时拼接的 SQL 时，目录无法仅凭文件确认哪些表或字段会被修改。实际结构以目标数据库为准。", "hint"),
      list,
    );
    fragment.append(details);
  }
  return fragment;
}
function renderDetails() {
  const detail = get("detail");
  detail.replaceChildren();
  const row = tables.get(states.table);
  if (!row) {
    detail.append(element("p","选择数据表后查看字段、备注与示例数据。","empty"));
    return;
  }
  const heading = element("h2");
  heading.append(element("code",row.name));
  detail.append(heading, badge(row.status));
  detail.append(element("p",row.comment || "表备注未填写"));
  const description = [row.module, row.business, source(row.source)].filter(Boolean).join(" · ");
  detail.append(element("div",description,"detail-meta"));
  const tabs = element("div","","tabbar");
  tabs.setAttribute("role","group");
  tabs.setAttribute("aria-label","表详情栏目");
  const content = {"字段":renderFields, "索引与表关系":renderRelationships, "示例数据":renderExamples, "来源与核对":renderSources};
  for (const name of Object.keys(content)) {
    const choice = button(name, "", () => {
      states.tab = name;
      renderDetails();
      detail.querySelector('[aria-pressed="true"]').focus();
    }, name === states.tab);
    tabs.append(choice);
  }
  detail.append(tabs);
  const panel = element("section", "", "detail-panel");
  panel.setAttribute("aria-label", states.tab);
  panel.append(content[states.tab](row));
  detail.append(panel);
  detail.scrollTop = 0;
}
function render() {
  const rows = matching();
  if (!rows.some(table => table.name === states.table)) {
    states.table = rows[0]?.name || "";
    states.tab = "字段";
  }
  history.replaceState(null, "", states.table ? tableLink(states.table) : "#catalog");
  renderModules();
  renderList(rows);
  renderDetails();
}
function fromLocation() {
  if (!location.hash) {
    show("home");
    return;
  }
  const key = new URLSearchParams(location.hash.slice(1)).get("table");
  show("catalog");
  states.table = tables.has(key) ? key : "";
  if (states.table) setMobile("detail");
  render();
}
get("brand-mark").src = get("catalog-icon").href;
document.title = doc.project + " · 数据库文档";
document.querySelectorAll("[data-project]").forEach(node => { node.textContent = doc.project; });
document.querySelectorAll("[data-database]").forEach(node => { node.textContent = doc.database; });
get("snapshot-branch").textContent = doc.branch || "未记录";
get("snapshot-time").textContent = "整理时间 · " + doc.generated;
const counts = {
  tables: doc.tables.length,
  fields: doc.tables.reduce((total, row) => total + row.columns.length, 0),
  modules: modules.size
};
document.querySelectorAll("[data-count]").forEach(node => {
  node.textContent = counts[node.dataset.count].toLocaleString("zh-CN");
});
const modulePreviewLimit = 10;
const moduleOrder = [...modules.keys()];
if (modules.size > modulePreviewLimit) {
  moduleOrder.sort((left, right) => modules.get(right) - modules.get(left));
}
get("shortcuts").append(...moduleOrder.slice(0, modulePreviewLimit).map(key => {
  const link = button(key, "shortcut", () => selectModule(key));
  const arrow = element("span", "↗");
  arrow.setAttribute("aria-hidden", "true");
  link.append(arrow);
  return link;
}));
if (modules.size > modulePreviewLimit) {
  const more = button("...", "shortcut shortcut-more", () => {
    selectModule("");
    setMobile("module");
    get("modules").querySelector("button").focus({ preventScroll: true });
  });
  more.setAttribute("aria-label", "查看全部 " + modules.size + " 个业务模块");
  get("module-shortcuts").append(more);
}
const mobileNav = document.querySelector(".mobile-nav");
for (const [key, text] of [["module","模块"],["list","数据表"],["detail","详情"]]) {
  const control = button(text, "", () => setMobile(key), key === states.mobile);
  control.id = "nav-" + key;
  control.setAttribute("aria-controls",key + "-pane");
  mobileNav.append(control);
}
get("search").addEventListener("input",render);
get("status").addEventListener("change",render);
get("browse").addEventListener("click", () => selectModule(""));
get("back").addEventListener("click", event => {
  event.preventDefault();
  history.replaceState(null, "", location.href.split("#")[0]);
  show("home");
});
window.addEventListener("wheel", event => {
  if (document.body.dataset.screen !== "home" || event.ctrlKey ||
      event.deltaY <= 0 || Math.abs(event.deltaX) > event.deltaY) return;
  const cover = get("home").querySelector(".cover-main");
  const hasRoomToScroll = cover.scrollTop + cover.clientHeight < cover.scrollHeight - 1;
  if (cover.contains(event.target) && hasRoomToScroll) return;
  event.preventDefault();
  selectModule("");
}, { passive: false });
window.addEventListener("hashchange", fromLocation);
fromLocation();
requestAnimationFrame(() => {
  requestAnimationFrame(() => { document.body.dataset.ready = ""; });
});
</script>
</body>
</html>
